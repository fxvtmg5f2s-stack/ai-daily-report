name: Hot Flash Watch

on:
  schedule:
    # 北京时间 8:00-21:45 每 15 分钟一次（UTC 0-13点）。
    # 夜间 22:00-次日 8:00 静默不跑（省费用+不打扰）；summarize.mjs 内有北京时间双保险。
    - cron: "*/15 0-13 * * *"
  workflow_dispatch: {}

# 2026-10-25：去重状态从 Actions artifact 改为仓库内 state/pushed.json。
# 旧做法用 download-artifact@v4 且没带 run-id，只下载“当前 run”的 artifact；
# 每次开跑时当前 run 还没有 artifact → 日志报 Artifact not found → 12h 状态永远为空，
# 同一条旧闻可以几小时内反复推（2026-10-24 16:05 / 20:40 两次 V4.1 Flash 就是这个原因）。
permissions:
  contents: write

concurrency:
  group: hot-flash
  cancel-in-progress: false

jobs:
  hot-flash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 抓取信息源（热模式）
        run: HOT_MODE=1 node scripts/fetch-sources.mjs

      - name: DeepSeek 爆炸判定
        run: HOT_MODE=1 node scripts/summarize.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: 推送（仅爆炸级，微信 + Bark）
        run: node scripts/push.mjs hot
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}

      - name: 保存推送去重状态（有变化才提交）
        if: always()
        run: |
          if [ ! -f state/pushed.json ]; then
            echo "没有 state/pushed.json（本次没有推送或判定失败），跳过"
            exit 0
          fi
          git config user.name "hot-flash-bot"
          git config user.email "bot@local"
          git add state/pushed.json
          if git diff --cached --quiet; then
            echo "state 无变化，跳过提交"
            exit 0
          fi
          git commit -m "hot-state: $(TZ=Asia/Shanghai date +%F-%H:%M)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "state 已回写（第 $i 次）"
              ok=1
              break
            fi
            echo "state 回写失败（第 $i 次），5 秒后重试"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::state/pushed.json 回写失败；下一班去重会退回上一次已提交的状态"
            exit 1
          fi
